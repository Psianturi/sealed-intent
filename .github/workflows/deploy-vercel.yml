# Deploys the static site (landing page, Arena replay, receipt verifier) to Vercel.
# Enable by setting the repository variable DEPLOY_VERCEL=true and the secrets
# VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID. The site lives in apps/web (added later).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  vercel:
    if: vars.DEPLOY_VERCEL == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sealed-intent/web build
      - run: npx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: npx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: apps/web
