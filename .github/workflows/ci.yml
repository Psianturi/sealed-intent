name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm redteam
      - run: pnpm demo
      - run: pnpm verify out/receipts
      - run: pnpm arena:run
      - run: pnpm arena:verify
      - run: pnpm arena:verify official-sandbox
      - run: pnpm web:build
