name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm redteam
      - run: pnpm demo
      - run: pnpm verify out/receipts
      - run: pnpm arena:run
      - run: pnpm arena:verify
      - run: pnpm arena:verify official-sandbox
      - run: pnpm arena:verify official-lazy
      - run: pnpm web:build
      - run: pnpm secret:scan
      - run: pnpm audit --audit-level=high
      - run: sudo env "PATH=$PATH" bash scripts/isolation-check.sh
